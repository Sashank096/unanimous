{% extends "base.html" %}
{% block title %}Set new password — U_NANI_MOUS{% endblock %}
{% block body_class %}auth{% endblock %}
{% block body %}
<div class="auth-wrap">
  <div class="card">
    <a class="logo" href="{{ url_for('index') }}">U_NANI_MOUS</a>
    <h1>Set a new password</h1>
    <p class="sub" id="statusMsg">Verifying your reset link…</p>

    <form id="resetForm" style="display:none">
      <label for="password">New password</label>
      <input id="password" type="password" placeholder="At least 6 characters" required minlength="6">
      <label for="password2">Confirm new password</label>
      <input id="password2" type="password" placeholder="Repeat password" required minlength="6">
      <button class="btn" type="submit">Update password</button>
    </form>
    <div id="resultMsg"></div>
    <a class="back" href="{{ url_for('login') }}">← Back to log in</a>
  </div>
</div>

<script>
  const SUPABASE_URL = "{{ supabase_url }}";
  const SUPABASE_ANON_KEY = "{{ supabase_anon_key }}";

  // Supabase's recovery email links land here with the token in the URL
  // fragment (#access_token=...&type=recovery), which browsers never send
  // to the server — so this has to be read and used client-side.
  const hashParams = new URLSearchParams(window.location.hash.slice(1));
  const accessToken = hashParams.get("access_token");
  const type = hashParams.get("type");

  const statusMsg = document.getElementById("statusMsg");
  const form = document.getElementById("resetForm");
  const resultMsg = document.getElementById("resultMsg");

  if (accessToken && type === "recovery") {
    statusMsg.textContent = "Link verified. Choose a new password below.";
    form.style.display = "";
  } else {
    statusMsg.textContent = "This reset link is invalid or has expired. Request a new one from the login page.";
  }

  form?.addEventListener("submit", async (e) => {
    e.preventDefault();
    const password = document.getElementById("password").value;
    const password2 = document.getElementById("password2").value;
    if (password !== password2) {
      resultMsg.innerHTML = '<div class="msg error">Passwords don\'t match.</div>';
      return;
    }
    resultMsg.textContent = "Updating…";
    try {
      const res = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
        method: "PUT",
        headers: {
          "apikey": SUPABASE_ANON_KEY,
          "Authorization": `Bearer ${accessToken}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ password })
      });
      const data = await res.json();
      if (res.ok) {
        form.style.display = "none";
        resultMsg.innerHTML = '<div class="msg ok">Password updated! You can log in with it now.</div>';
      } else {
        resultMsg.innerHTML = '<div class="msg error">' + (data.msg || data.error_description || "Couldn't update password.") + '</div>';
      }
    } catch (err) {
      resultMsg.innerHTML = '<div class="msg error">Network error: ' + err.message + '</div>';
    }
  });
</script>
{% endblock %}
